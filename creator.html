<!DOCTYPE html>
<html lang="en">
<head>
<!-- ============================================================
     QV (QikVote) v0.1.0 — creator terminal
     Key-gated: publish ballots (with channel push), close them, watch tallies.
     F-Keys | www.f-keys.com
     ============================================================
     WORKFLOW STACK:
     1. Boot: load saved creator key from localStorage
     2. UNLOCK -> qv-publish action=list (validates key, loads ballots)
     3. PUBLISH -> qv-publish action=create (inserts + pushes to channel subs)
     4. CLOSE -> qv-publish action=close
     ASSET MANIFEST:
     - Google Fonts (Space Grotesk) via @import
     - Edge function: qv-publish
     BOOT ORDER: DOMContentLoaded -> init() -> auto-unlock if key saved
     ============================================================ -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QV — creator terminal</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8826956454892311" crossorigin="anonymous"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap');
:root{
  --bg:#06090e; --panel:#0b1118; --line:#14202e; --txt:#d7e6f2; --dim:#6b8299;
  --a:#46d8ff; --b:#ff5d73; --ok:#59e0a0;
}
*{box-sizing:border-box; margin:0; padding:0}
body{background:var(--bg); color:var(--txt); font-family:'Space Grotesk',system-ui,sans-serif; min-height:100vh; display:flex; flex-direction:column}
main{width:100%; max-width:680px; margin:0 auto; padding:20px 16px 40px; flex:1}
a{color:var(--a); text-decoration:none}
.top{display:flex; justify-content:space-between; align-items:baseline; padding:12px 0 18px}
.top .qv{font-weight:700; font-size:1.2rem; letter-spacing:.06em; color:var(--a)}
.top .who{color:var(--dim); font-size:.85rem}
.card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px}
h2{font-size:.8rem; letter-spacing:.18em; color:var(--dim); text-transform:uppercase; margin-bottom:12px}
input,textarea,select{width:100%; background:var(--bg); border:1px solid var(--line); border-radius:8px; color:var(--txt); font-family:inherit; font-size:.95rem; padding:10px 12px; margin-bottom:10px}
input:focus,textarea:focus,select:focus{outline:none; border-color:var(--a)}
.half{display:flex; gap:10px}
.half>*{flex:1}
.btn{display:inline-block; border:1px solid var(--a); border-radius:10px; background:none; color:var(--a); font-family:inherit; font-weight:700; font-size:.95rem; letter-spacing:.04em; padding:12px 18px; cursor:pointer; width:100%}
.btn:hover{background:rgba(70,216,255,.08)}
.btn[disabled]{opacity:.45; cursor:default}
.status{font-size:.9rem; margin-top:10px; min-height:1.2em}
.status.ok{color:var(--ok)}
.status.err{color:var(--b)}
.note{color:var(--dim); font-size:.85rem; line-height:1.5}
.poll{border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px}
.poll .q{font-weight:500; margin-bottom:6px}
.poll .meta{color:var(--dim); font-size:.8rem; margin-bottom:8px}
.poll .row{display:flex; gap:8px}
.sbtn{border:1px solid var(--line); border-radius:8px; background:none; color:var(--dim); font-family:inherit; font-size:.8rem; padding:7px 12px; cursor:pointer}
.sbtn:hover{border-color:var(--a); color:var(--a)}
.sbtn.danger:hover{border-color:var(--b); color:var(--b)}
footer{border-top:1px solid var(--line); color:var(--dim); text-align:center; font-size:.8rem; padding:16px; line-height:1.8}
</style>
</head>
<body>
<main>
  <div class="top"><a class="qv" href="index.html">QV</a><span class="who" id="who">creator terminal</span></div>

  <div class="card" id="lockCard">
    <h2>Creator key</h2>
    <input id="key" type="password" placeholder="qvc_…" autocomplete="off">
    <button class="btn" id="unlockBtn">UNLOCK</button>
    <div class="status" id="lockStatus"></div>
    <div class="note" style="margin-top:8px">No key? <a href="index.html">Apply on the home page.</a></div>
  </div>

  <div id="terminal" style="display:none">
    <div class="card">
      <h2>Publish a ballot</h2>
      <input id="pq" maxlength="140" placeholder="the question (3–140 chars)" autocomplete="off">
      <textarea id="pd" maxlength="500" rows="2" placeholder="context / detail (optional, shown under the question)"></textarea>
      <div class="half">
        <input id="pla" maxlength="25" placeholder="option A label (YES)" autocomplete="off">
        <input id="plb" maxlength="25" placeholder="option B label (NO)" autocomplete="off">
      </div>
      <div class="half">
        <input id="pch" maxlength="32" placeholder="channel (general)" autocomplete="off">
        <select id="pmin">
          <option value="60">closes in 1 hour</option>
          <option value="240">closes in 4 hours</option>
          <option value="1440" selected>closes in 24 hours</option>
          <option value="10080">closes in 7 days</option>
          <option value="43200">closes in 30 days</option>
          <option value="0">open-ended</option>
        </select>
      </div>
      <button class="btn" id="pubBtn">PUBLISH + PUSH</button>
      <div class="status" id="pubStatus"></div>
    </div>

    <div class="card">
      <h2>Your ballots</h2>
      <div id="polls"><span class="note">—</span></div>
      <button class="btn" id="refreshBtn" style="margin-top:6px">REFRESH TALLIES</button>
    </div>
  </div>
</main>
<footer>QV v0.1.0<br>www.f-keys.com | © 2026 F-Keys™</footer>

<script>
// ============================================================
// QV creator terminal script — var-only, single STATE object
// ============================================================
var QV = { FN: 'https://ihclxurachkewtgnrldc.supabase.co/functions/v1' };

var STATE = {
  key: '',    // creator key (kept in localStorage on this device only)
  busy: false
};

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function setStatus(id, msg, ok) {
  var el = document.getElementById(id);
  el.textContent = msg;
  el.className = 'status ' + (ok ? 'ok' : 'err');
}

// all creator calls go through one endpoint with the key in the body
async function call(payload) {
  payload.key = STATE.key;
  var r = await fetch(QV.FN + '/qv-publish', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify(payload)
  });
  return r.json();
}

// READS: #key / WRITES: STATE.key, localStorage qv_ckey
async function unlock() {
  if (STATE.busy) return;
  STATE.busy = true;
  try {
    STATE.key = document.getElementById('key').value.trim();
    var out = await call({ action: 'list' });
    if (out.ok) {
      try { localStorage.setItem('qv_ckey', STATE.key); } catch (e) {}
      document.getElementById('lockCard').style.display = 'none';
      document.getElementById('terminal').style.display = 'block';
      document.getElementById('who').textContent = 'creator: ' + out.name;
      renderPolls(out.polls);
    } else {
      setStatus('lockStatus', 'Key rejected.', false);
    }
  } catch (err) {
    console.error('unlock:', err);
    setStatus('lockStatus', 'Network error — try again.', false);
  }
  STATE.busy = false;
}

// WRITES: #polls DOM
function renderPolls(polls) {
  var el = document.getElementById('polls');
  if (!polls || polls.length === 0) { el.innerHTML = '<span class="note">No ballots yet.</span>'; return; }
  var html = '';
  for (var i = 0; i < polls.length; i++) {
    var p = polls[i];
    var tot = p.a_count + p.b_count;
    var pa = tot > 0 ? Math.round(p.a_count * 100 / tot) : 50;
    html += '<div class="poll">'
      + '<div class="q">' + esc(p.question) + '</div>'
      + '<div class="meta">' + (tot > 0 ? pa + '% · ' + (100 - pa) + '%' : 'no votes yet') + ' · '
      + (tot + p.p_count) + ' votes · #' + esc(p.channel) + ' · ' + esc(p.status).toUpperCase() + '</div>'
      + '<div class="row">'
      + '<button class="sbtn" data-open="' + esc(p.id) + '">OPEN</button>'
      + '<button class="sbtn" data-copy="' + esc(p.id) + '">COPY LINK</button>'
      + (p.status === 'open' ? '<button class="sbtn danger" data-close="' + esc(p.id) + '">CLOSE</button>' : '')
      + '</div></div>';
  }
  el.innerHTML = html;
  var btns = el.querySelectorAll('.sbtn');
  for (var j = 0; j < btns.length; j++) {
    btns[j].onclick = function () {
      var open = this.getAttribute('data-open');
      var copy = this.getAttribute('data-copy');
      var close = this.getAttribute('data-close');
      if (open) window.open('b.html?id=' + encodeURIComponent(open), '_blank');
      else if (copy) copyLink(copy, this);
      else if (close) closePoll(close);
    };
  }
}

async function copyLink(id, btn) {
  try {
    var base = location.href.slice(0, location.href.lastIndexOf('/') + 1);
    await navigator.clipboard.writeText(base + 'b.html?id=' + id);
    var old = btn.textContent;
    btn.textContent = 'COPIED ✓';
    setTimeout(function () { btn.textContent = old; }, 1500);
  } catch (err) { console.error('copyLink:', err); }
}

// WRITES: qv_polls via qv-publish create; fires the channel push
async function publish() {
  if (STATE.busy) return;
  STATE.busy = true;
  document.getElementById('pubBtn').disabled = true;
  try {
    var out = await call({
      action: 'create',
      question: document.getElementById('pq').value.trim(),
      detail: document.getElementById('pd').value.trim(),
      label_a: document.getElementById('pla').value.trim() || 'YES',
      label_b: document.getElementById('plb').value.trim() || 'NO',
      channel: (document.getElementById('pch').value.trim() || 'general').toLowerCase(),
      minutes: parseInt(document.getElementById('pmin').value, 10)
    });
    if (out.ok) {
      setStatus('pubStatus', 'Live: ' + out.id + ' · pushed to ' + out.pushed + ' device' + (out.pushed === 1 ? '' : 's')
        + (out.pruned ? ' · pruned ' + out.pruned + ' dead' : ''), true);
      document.getElementById('pq').value = '';
      document.getElementById('pd').value = '';
      refresh();
    } else {
      setStatus('pubStatus', 'Rejected: ' + (out.error || 'unknown'), false);
    }
  } catch (err) {
    console.error('publish:', err);
    setStatus('pubStatus', 'Network error — ballot may not be live.', false);
  }
  document.getElementById('pubBtn').disabled = false;
  STATE.busy = false;
}

async function closePoll(id) {
  try {
    var out = await call({ action: 'close', id: id });
    if (out.ok) refresh();
  } catch (err) { console.error('closePoll:', err); }
}

async function refresh() {
  try {
    var out = await call({ action: 'list' });
    if (out.ok) renderPolls(out.polls);
  } catch (err) { console.error('refresh:', err); }
}

function init() {
  document.getElementById('unlockBtn').onclick = unlock;
  document.getElementById('pubBtn').onclick = publish;
  document.getElementById('refreshBtn').onclick = refresh;
  try {
    var saved = localStorage.getItem('qv_ckey');
    if (saved) { document.getElementById('key').value = saved; unlock(); }
  } catch (e) {}
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
